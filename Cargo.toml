[package]
name = "databridge-gpui"
version = "0.1.0"
edition = "2024"
description = "DataBridge — database explorer UI built with GPUI"

[[bin]]
name = "databridge"
path = "src/main.rs"

[features]
default = ["postgres", "mysql", "sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "chrono", "json", "uuid"] }
chrono = "0.4"
uuid = "1"
serde_json = "1"
