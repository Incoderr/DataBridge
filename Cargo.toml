[package]
name = "databridge-gpui"
version = "0.5.0"
edition = "2024"
description = "DataBridge — database explorer UI built with GPUI"

[[bin]]
name = "databridge"
path = "src/main.rs"

[features]
default = ["postgres", "mysql", "sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dependencies]
# GPUI Kit 0.9 runs on the gpui-pre snapshot it pins exactly; the
# package is renamed so the code keeps importing `gpui::`.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = { version = "0.9.1", features = ["tree-sitter-languages"] }
gpui-kit-assets = "0.9.1"
# gpui-pre keeps the platforms in their own crate (`gpui_platform::application()`);
# features as gpui-kit enables them.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
async-trait = "0.1"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "chrono", "json", "uuid"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The v3 keyring needs an explicit platform store — without a feature
# every Entry::new() fails and all secrets are silently lost.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
rfd = "0.15"
# UI translations (locales/app.yml). Already in the tree via gpui-component,
# which shares the same process-wide locale for its own strings.
rust-i18n = "4"
# Types of gpui-component's `CompletionProvider` (SQL editor autocompletion);
# keep in step with the version gpui-component depends on.
lsp-types = "0.97"
# AI assistant (Stage 6): OpenAI-compatible HTTP + SSE. No bundled crypto
# provider — rustls+ring is already linked by sqlx; we install it (ai.rs).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Stage 4: own minimal MongoDB client (OP_MSG over tokio TCP + rustls, SCRAM);
# only the `bson` crate instead of the heavy official `mongodb` driver.
bson = { version = "2", features = ["chrono-0_4", "uuid-1"] }
# The rest of the Mongo client: all already in the tree via sqlx/reqwest
# (same versions), so they add no new crates — TLS over tokio, SCRAM-SHA-1/256.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
stringprep = "0.1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }

# mongodb+srv:// seed lists: SRV/TXT through the system resolver
# (`DnsQuery_W`). windows-sys 0.61 is already in the tree (gpui); only
# the Dns bindings are switched on, plus Threading for the instance mutex
# the installer waits for (`core::update::hold_instance_mutex`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_Dns", "Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
