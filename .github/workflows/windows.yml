# Windows build of the GPUI app (the repo root is cargo-only; /site has
# its own toolchain and deploys separately, so it does not trigger this).
#
# - every push to main / PR: tests, the mock-only build, a release build;
#   the zipped exe is kept as a workflow artifact for 14 days.
# - a pushed tag `v*` (e.g. `git tag v0.2.0 && git push origin v0.2.0`):
#   the same build, attached to a GitHub Release for that tag:
#   - `DataBridge-Setup-x64.exe` + `.sha256` (Inno Setup, installer/
#     databridge.iss) — the installer, and what the in-app updater
#     (src/core/update.rs, `SETUP_ASSET`) downloads and runs silently;
#   - the portable zip;
#   - the bare `databridge-windows-x64.exe` + `.sha256`: only for 0.3/0.4,
#     whose updater swaps the exe in place (the new version then offers the
#     installer). Keep all names.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["site/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Mock-only build (feature isolation)
        run: cargo check --no-default-features

      - name: Release build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $name = "databridge-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/databridge.exe dist/
          Compress-Archive -Path dist/databridge.exe -DestinationPath "$name.zip" -Force
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Self-update assets (names fixed in src/core/update.rs).
          $exe = "databridge-windows-x64.exe"
          Copy-Item target/release/databridge.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File -FilePath "$exe.sha256" -Encoding ascii -NoNewline

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\databridge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "DataBridge-Setup-x64.exe"
          Copy-Item "dist\$setup" $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup" | Out-File -FilePath "$setup.sha256" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: databridge-windows-x64
          path: |
            ${{ env.ZIP }}
            DataBridge-Setup-x64.exe
            DataBridge-Setup-x64.exe.sha256
            databridge-windows-x64.exe
            databridge-windows-x64.exe.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: databridge-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            DataBridge-Setup-x64.exe
            DataBridge-Setup-x64.exe.sha256
            *.zip
            databridge-windows-x64.exe
            databridge-windows-x64.exe.sha256
          generate_release_notes: true
